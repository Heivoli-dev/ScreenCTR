# ScreenCTR CI — tests (Linux), console sysmodule (devkitARM), Windows app (Qt 6 + SDL3)
# NOTE: written without being able to run it; the first run may need small fixes
# (tool versions, artefact names). See docs/STATUS.md.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the release job publishes the "nightly" release

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil ffmpeg
      - name: Run all host tests
        run: bash scripts/run_tests.sh

  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch makerom (Project_CTR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools-bin
          gh release download -R 3DSGuy/Project_CTR --pattern "makerom-*ubuntu*" -D tools-bin
          gh release download -R Steveice10/bannertool --pattern "bannertool*.zip" -D tools-bin
          cd tools-bin && unzip -o makerom-*.zip && unzip -o bannertool*.zip -d bannertool
          cp "$(find bannertool -path '*linux-x86_64*' -name bannertool -type f | head -1)" ./bannertool
          chmod +x makerom bannertool
      - name: Compile sysmodule ELF and launcher (.3dsx) with devkitARM
        run: |
          docker run --rm -v "$PWD:/src" -w /src/console devkitpro/devkitarm \
            bash -c "make build/ScreenCTR.elf && make launcher && chown -R $(id -u):$(id -g) /src/console"
      - name: Package sysmodule (.cxi -> .cia) with makerom on the host
        # makerom's Linux build needs a newer glibc than the devkitarm image ships
        run: |
          cd console
          ../tools-bin/makerom -f ncch -rsf screenctr.rsf -nocodepadding -o build/ScreenCTR.cxi -elf build/ScreenCTR.elf
          ../tools-bin/makerom -f cia -o ScreenCTR.cia -i build/ScreenCTR.cxi:0:0 -ignoresign
      - name: Package launcher as a HOME Menu CIA
        run: |
          cd console/launcher
          ../../tools-bin/bannertool makebanner -i ../../assets/banner.png -a ../../assets/banner_silence.wav -o build/banner.bnr
          ../../tools-bin/bannertool makesmdh -s "ScreenCTR" -l "Two screens. One connection." -p "Heivoli Network" -i ../../assets/icon48.png -o build/icon.icn
          ../../tools-bin/makerom -f cia -o ScreenCTR-Launcher.cia -elf ScreenCTR-Launcher.elf -rsf launcher.rsf \
            -icon build/icon.icn -banner build/banner.bnr -exefslogo -target t
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCTR-console
          path: |
            console/ScreenCTR.cia
            console/launcher/ScreenCTR-Launcher.3dsx
            console/launcher/ScreenCTR-Launcher.cia
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
      - name: Build SDL3
        shell: pwsh
        run: |
          git clone --depth 1 --branch release-3.2.x https://github.com/libsdl-org/SDL.git sdl
          cmake -S sdl -B sdl/build -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl-install"
          cmake --build sdl/build --config Release --target install
      - name: Build ScreenCTR
        shell: pwsh
        run: |
          cmake -S pc -B pc/build -DCMAKE_PREFIX_PATH="$PWD/sdl-install" -DCMAKE_INSTALL_PREFIX="$PWD/dist/ScreenCTR"
          cmake --build pc/build --config Release
          ctest --test-dir pc/build -C Release --output-on-failure
          cmake --install pc/build --config Release
      - name: Bundle FFmpeg (MP4 recording works out of the box)
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist/ScreenCTR/ffmpeg.exe
      - name: Licences
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/ScreenCTR/LICENSE.txt
          Copy-Item CREDITS.md dist/ScreenCTR/CREDITS.md
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCTR-windows
          path: dist/ScreenCTR

  # Rolling pre-release with stable direct links (used by the QR code / FBI):
  #   https://github.com/Heivoli-dev/ScreenCTR/releases/download/nightly/ScreenCTR.cia
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [tests, console, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Prepare files and QR code
        run: |
          mkdir -p rel
          cp art/ScreenCTR-console/ScreenCTR.cia rel/
          cp art/ScreenCTR-console/launcher/ScreenCTR-Launcher.3dsx rel/
          cp art/ScreenCTR-console/launcher/ScreenCTR-Launcher.cia rel/
          mv art/ScreenCTR-windows art/ScreenCTR
          (cd art && zip -qr ../rel/ScreenCTR-Windows.zip ScreenCTR)
          pip install --quiet qrcode[pil]
          python3 tools/make_qr.py "https://github.com/${{ github.repository }}/releases/download/nightly/ScreenCTR.cia" rel/ScreenCTR-cia-QR.png "1. ScreenCTR.cia"
          python3 tools/make_qr.py "https://github.com/${{ github.repository }}/releases/download/nightly/ScreenCTR-Launcher.cia" rel/ScreenCTR-Launcher-cia-QR.png "2. ScreenCTR-Launcher.cia"
          ls -la rel
      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin nightly
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ScreenCTR — version de développement (non testée sur console)
          prerelease: true
          make_latest: false
          body: |
            Version compilée automatiquement depuis `main` (${{ github.sha }}).
            **Pas encore validée sur console** — voir docs/STATUS.md et docs/HARDWARE_TEST_PLAN.md.

            - **Console** : dans FBI, « Remote Install » → « Scan QR Code », scannez `ScreenCTR-cia-QR.png` puis `ScreenCTR-Launcher-cia-QR.png`. Lancez ensuite **ScreenCTR** depuis le menu HOME (redémarrez la console après une mise à jour).
            - **Windows** : téléchargez `ScreenCTR-Windows.zip`, décompressez, lancez `ScreenCTR\ScreenCTR.exe`.
          files: rel/*
